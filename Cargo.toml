# Workspace for all Rust crates: the Tauri desktop shell, the `brain` CLI, and the
# shared brain-schema crate. One lockfile pins one SQLite everywhere — the desktop
# writer and the CLI reader can never skew on SQLite version or schema.
[workspace]
resolver = "2"
members = [
  "apps/cli",
  "apps/desktop/src-tauri",
  "crates/brain-schema",
]

[workspace.dependencies]
brain-schema = { path = "crates/brain-schema" }
rusqlite = { version = "0.40.1", features = ["bundled", "functions"] }
rusqlite_migration = "2.6.0"
sqlite-vec = "0.1.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
tempfile = "3.27.0"
unicode-normalization = "0.1.25"
