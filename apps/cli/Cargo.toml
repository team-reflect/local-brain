[package]
name = "brain-cli"
version = "0.1.0"
edition = "2021"
description = "The `brain` CLI: the supported agent interface to a Local Brain database"

[[bin]]
name = "brain"
path = "src/main.rs"

[dependencies]
brain-schema = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
unicode-normalization = { workspace = true }
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }
