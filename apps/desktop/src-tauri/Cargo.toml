[package]
name = "local-brain-desktop"
version = "0.1.15"
edition = "2021"
description = "Local Brain desktop app (Tauri 2 shell)"

[lib]
name = "local_brain_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `devtools` keeps the Web Inspector available in release builds too. Without
# it Tauri strips these APIs outside debug builds.
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
brain-schema = { workspace = true }
rusqlite = { workspace = true }
sha2 = { workspace = true }
time = { version = "0.3.49", features = ["formatting"] }
# Local embedding runtime (Reflect-embeddings port): fastembed (ONNX) in-process,
# off the UI thread. Semantic search is desktop-only; the model is downloaded on
# demand into app data, never bundled. hf-hub pre-fetches the model files with
# byte-level progress (fastembed downloads silently inside `try_new`).
fastembed = "5"
hf-hub = { version = "0.5.0", default-features = false, features = ["ureq", "native-tls"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[dev-dependencies]
tempfile = { workspace = true }
