name: Automatic release

on:
  workflow_run:
    workflows: [CI]
    branches: [master]
    types: [completed]
  workflow_dispatch:
    inputs:
      bump:
        description: Optional bump level or explicit version (default next patch or beta)
        type: string
        required: false

# Hold the slot through publishing. Bursts of merges coalesce into the latest
# tested master; an older queued notification cannot rewind the source commit.
concurrency:
  group: automatic-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare the tested release commit
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    outputs:
      release_needed: ${{ steps.prepare.outputs.release_needed }}
      release_ref: ${{ steps.prepare.outputs.release_ref }}
    steps:
      # workflow_run is privileged: execute only trusted master code, never a
      # PR head or anything downloaded from the triggering workflow's artifacts.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: master

      - name: Bump or resume the release
        id: prepare
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          BUMP: ${{ inputs.bump }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { prepareRelease } = await import(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/prepare-release.mjs`
            )
            const release = await prepareRelease({
              github, context, core, bump: process.env.BUMP?.trim() || undefined,
            })
            core.setOutput('release_needed', release.releaseNeeded)
            core.setOutput('release_ref', release.releaseRef ?? '')

  # GITHUB_TOKEN version commits do not trigger another push workflow. Call
  # publishing directly, with only the write permission needed for releases.
  publish:
    name: Build and publish macOS
    needs: prepare
    if: needs.prepare.outputs.release_needed == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      release_ref: ${{ needs.prepare.outputs.release_ref }}
      draft: false
    secrets:
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
