name: Release PR

on:
  push:
    branches: [master]
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      bump:
        description: Optional bump level or explicit version for the rolling release PR
        type: string
        required: false

jobs:
  maintain-release-pr:
    name: Maintain the rolling release PR
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    concurrency:
      group: release-pr-maintain-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # Reconcile the latest master snapshot. GitHub does not guarantee
          # concurrency ordering, so an older queued push must not rewind the
          # fixed automation branch after a newer run.
          ref: master

      - name: Create or update the release PR
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          BUMP: ${{ inputs.bump }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { maintainReleasePullRequest } = await import(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/maintain-release-pr.mjs`
            )

            await maintainReleasePullRequest({
              github,
              context,
              core,
              bump: process.env.BUMP?.trim() || undefined,
            })

  analyze-release-merge:
    name: Validate a merged release PR
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'master' &&
      github.event.pull_request.head.ref == 'automation/release' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      release_needed: ${{ steps.analyze.outputs.release_needed }}
      release_ref: ${{ steps.analyze.outputs.release_ref }}
    steps:
      # pull_request_target deliberately checks out trusted master, never the
      # pull request head, before deciding whether release secrets may be used.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # Execute the analyzer from the trusted pre-merge base. The merged
          # commit is inspected through the API before any of its code runs.
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Validate the release merge
        id: analyze
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { analyzeMergedReleasePullRequest } = await import(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/maintain-release-pr.mjs`
            )

            const release = await analyzeMergedReleasePullRequest({ github, context, core })
            core.setOutput('release_needed', release.releaseNeeded)
            core.setOutput('release_ref', release.releaseRef ?? '')

  # This job is the only path from a generated PR to signing secrets. The
  # analyzer requires the same-repository automation/release branch, durable
  # body markers, exactly the three version files, and a forward version bump.
  publish-release:
    name: Build and publish the release
    needs: analyze-release-merge
    if: needs.analyze-release-merge.outputs.release_needed == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      release_ref: ${{ needs.analyze-release-merge.outputs.release_ref }}
      draft: false
    secrets:
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  # A feature can merge while the notarization job is running. GITHUB_TOKEN's
  # release/tag events do not wake this workflow, so reconcile master once more
  # after a successful publish to avoid leaving those commits without a PR.
  maintain-after-publish:
    name: Reconcile after publishing
    needs: publish-release
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    concurrency:
      group: release-pr-maintain-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: master

      - name: Create or update the next release PR
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { maintainReleasePullRequest } = await import(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/maintain-release-pr.mjs`
            )

            await maintainReleasePullRequest({ github, context, core })
